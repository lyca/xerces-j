plugins {
    id 'base'
}

allprojects {
    group = 'org.apache.xerces'
    version = '2.12.3'
    description = 'Apache Xerces-J XML Parser'
}

subprojects {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        withSourcesJar()
        withJavadocJar()
        if (project.hasProperty('testJavaVersion')) {
            toolchain {
                languageVersion = JavaLanguageVersion.of(project.property('testJavaVersion') as int)
            }
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.tags = [
            'xerces.internal:a:Internal:',
            'xerces.experimental:a:Experimental:'
        ]
        if (options instanceof CoreJavadocOptions) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }

    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from(rootProject.rootDir) {
            include 'LICENSE', 'NOTICE'
            into 'META-INF'
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        workingDir = rootProject.rootDir

        systemProperty 'javax.xml.parsers.DocumentBuilderFactory', 'org.apache.xerces.jaxp.DocumentBuilderFactoryImpl'
        systemProperty 'javax.xml.parsers.SAXParserFactory', 'org.apache.xerces.jaxp.SAXParserFactoryImpl'
        systemProperty 'javax.xml.validation.SchemaFactory:http://www.w3.org/2001/XMLSchema', 'org.apache.xerces.jaxp.validation.XMLSchemaFactory'

        testLogging {
            events 'passed', 'skipped', 'failed'
            showStandardStreams = false
        }
    }
}

tasks.register('docs') {
    description = 'Generates HTML documentation and aggregates Javadocs'
    group = 'documentation'
    dependsOn ':xerces-impl:javadoc'

    def docsSourceDir = file('docs')
    def buildDocsDir = layout.buildDirectory.dir('docs')
    def xdocsDir = layout.buildDirectory.dir('xdocs')
    def intermediateDir = layout.buildDirectory.dir('intermediate')

    inputs.dir(docsSourceDir)
    outputs.dir(buildDocsDir)

    doLast {
        def docsOut = buildDocsDir.get().asFile
        def xdocsOut = xdocsDir.get().asFile
        def intermediateOut = intermediateDir.get().asFile

        docsOut.mkdirs()
        xdocsOut.mkdirs()
        intermediateOut.mkdirs()

        // 1. Copy docs to xdocs and replace tokens in entities.ent
        copy {
            from docsSourceDir
            into xdocsOut
        }

        def entitiesFile = file("${xdocsOut}/dtd/entities.ent")
        if (entitiesFile.exists()) {
            def text = entitiesFile.text
            text = text.replace('@@VERSION@@', project.version.toString())
            text = text.replace('@@version@@', project.version.toString())
            text = text.replace('@@_version_@@', project.version.toString().replace('.', '_'))
            text = text.replace('@@DEFAULT_CONFIG@@', 'XIncludeAwareParserConfiguration')
            text = text.replace('@@DEFAULT_CONFIG_LONG@@', 'org.apache.xerces.parsers.XIncludeAwareParserConfiguration')
            entitiesFile.text = text
        }

        // 2. Intermediate XSLT transformations
        ant.xslt(
            destdir: intermediateOut,
            basedir: xdocsOut,
            includes: 'faq-*.xml',
            style: "${docsSourceDir}/style/stylesheets/faqs2document.xsl",
            extension: '.xml'
        ) {
            outputproperty(name: 'method', value: 'xml')
        }

        ant.xslt(
            in: "${docsSourceDir}/docs-book.xml",
            out: "${intermediateOut}/groupfaqs.xml",
            style: "${docsSourceDir}/style/stylesheets/book2group.xsl",
            extension: '.xml'
        ) {
            outputproperty(name: 'method', value: 'xml')
            outputproperty(name: 'indent', value: 'yes')
        }

        ant.xslt(
            in: "${intermediateOut}/groupfaqs.xml",
            out: "${intermediateOut}/faqs.xml",
            style: "${docsSourceDir}/style/stylesheets/group2document.xsl",
            extension: '.xml'
        ) {
            outputproperty(name: 'method', value: 'xml')
        }

        ant.xslt(
            destdir: intermediateOut,
            basedir: xdocsOut,
            includes: 'properties.xml,features.xml',
            style: "${docsSourceDir}/style/stylesheets/settings2document.xsl",
            extension: '.xml'
        ) {
            outputproperty(name: 'method', value: 'xml')
        }

        ant.xslt(
            destdir: intermediateOut,
            basedir: xdocsOut,
            includes: 'releases.xml',
            style: "${docsSourceDir}/style/stylesheets/releases2document.xsl",
            extension: '.xml'
        ) {
            outputproperty(name: 'method', value: 'xml')
        }

        // 3. Final HTML transformations
        ant.xslt(
            destdir: docsOut,
            basedir: intermediateOut,
            includes: 'faq*.xml,features.xml,properties.xml,releases.xml',
            filenameparameter: 'sourceFilePath',
            style: "${docsSourceDir}/style/stylesheets/document2html.xsl"
        )

        ant.xslt(
            destdir: docsOut,
            basedir: xdocsOut,
            filenameparameter: 'sourceFilePath',
            includes: 'api.xml, charter.xml, dom.xml, dom3.xml, download.xml, install.xml, jira.xml, limitations.xml, releases.xml, sax.xml, security.xml, source-repository.xml, xml-schema.xml, samples*.xml, xni*.xml',
            style: "${docsSourceDir}/style/stylesheets/document2html.xsl"
        )

        ant.xslt(
            in: "${xdocsOut}/readme.xml",
            out: "${docsOut}/index.html",
            style: "${docsSourceDir}/style/stylesheets/document2html.xsl"
        ) {
            param(name: 'id', expression: 'index')
        }

        // 4. Copy static resources and assets
        copy {
            from("${docsSourceDir}/download.cgi")
            into(docsOut)
        }
        copy {
            from("${docsSourceDir}/style/resources")
            into("${docsOut}/resources")
        }
        copy {
            from("${docsSourceDir}/style/graphics")
            into("${docsOut}/graphics")
        }
        copy {
            from(docsSourceDir) {
                include '*.gif', '*.jpg', '*.png'
            }
            into(docsOut)
        }

        // 5. Copy generated Javadocs
        copy {
            from(project(':xerces-impl').tasks.named('javadoc').get().destinationDir)
            into("${docsOut}/javadocs/xerces2")
        }

        logger.lifecycle("HTML Documentation successfully generated into ${docsOut}")
    }
}

def distVersionStr = project.version.toString().replace('.', '_')
def distBaseName = "xerces-${distVersionStr}"

tasks.register('distSrcZip', Zip) {
    group = 'distribution'
    description = 'Builds the ASF source distribution ZIP archive'
    archiveBaseName.set('Xerces-J-src')
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))

    from(rootDir) {
        into distBaseName
        include 'xerces-impl/**'
        include 'xerces-samples/**'
        include 'xerces-tools/**'
        include 'docs/**'
        include 'data/**'
        include 'gradle/**'
        include 'gradlew'
        include 'gradlew.bat'
        include 'build.gradle'
        include 'settings.gradle'
        include 'build.xml'
        include 'README.md'
        include 'LICENSE*'
        include 'NOTICE*'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/*.iml'
        exclude '**/*.class'
    }
}

tasks.register('distSrcTar', Tar) {
    group = 'distribution'
    description = 'Builds the ASF source distribution TAR.GZ archive'
    archiveBaseName.set('Xerces-J-src')
    archiveVersion.set(project.version.toString())
    archiveExtension.set('tar.gz')
    compression = Compression.GZIP
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))

    from(rootDir) {
        into distBaseName
        include 'xerces-impl/**'
        include 'xerces-samples/**'
        include 'xerces-tools/**'
        include 'docs/**'
        include 'data/**'
        include 'gradle/**'
        include 'gradlew'
        include 'gradlew.bat'
        include 'build.gradle'
        include 'settings.gradle'
        include 'build.xml'
        include 'README.md'
        include 'LICENSE*'
        include 'NOTICE*'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/*.iml'
        exclude '**/*.class'
    }
}

tasks.register('distBinZip', Zip) {
    group = 'distribution'
    description = 'Builds the ASF binary distribution ZIP archive'
    dependsOn ':xerces-impl:jar', ':xerces-impl:dtdJar', ':xerces-samples:jar', 'docs'
    archiveBaseName.set('Xerces-J-bin')
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))

    into(distBaseName) {
        from(project(':xerces-impl').tasks.named('jar'))
        from(project(':xerces-impl').tasks.named('dtdJar'))
        from(project(':xerces-samples').tasks.named('jar'))

        from(project(':xerces-impl').configurations.runtimeClasspath) {
            include 'xml-apis*.jar', 'xml-resolver*.jar'
        }

        from(layout.buildDirectory.dir('docs')) {
            into 'docs'
        }

        from('data') {
            into 'data'
        }

        from('xerces-samples/src/main/java') {
            into 'samples'
        }

        from(rootDir) {
            include 'LICENSE*', 'NOTICE*', 'README.md'
        }
    }
}

tasks.register('distBinTar', Tar) {
    group = 'distribution'
    description = 'Builds the ASF binary distribution TAR.GZ archive'
    dependsOn ':xerces-impl:jar', ':xerces-impl:dtdJar', ':xerces-samples:jar', 'docs'

plugins {
    id 'java'
}

group = 'org.apache.xerces'
version = '2.12.3'
description = 'Apache Xerces-J XML Parser'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
    samples {
        java {
            srcDirs = ['samples']
        }
        resources {
            srcDirs = ['samples']
            exclude '**/*.java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        java {
            srcDirs = ['tests']
        }
        resources {
            srcDirs = ['tests', 'data']
            exclude '**/*.java'
        }
        compileClasspath += sourceSets.samples.output
        runtimeClasspath += sourceSets.samples.output
    }
}

configurations {
    samplesImplementation.extendsFrom implementation
    samplesRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation 'xml-apis:xml-apis:1.4.01'
    implementation 'xml-resolver:xml-resolver:1.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation sourceSets.samples.output
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
}

tasks.named('compileTestJava') {
    options.encoding = 'UTF-8'
}

tasks.named('compileSamplesJava') {
    options.encoding = 'UTF-8'
}

processResources {
    into('META-INF/services') {
        from('src/org/apache/xerces/jaxp/javax.xml.parsers.DocumentBuilderFactory')
        from('src/org/apache/xerces/jaxp/javax.xml.parsers.SAXParserFactory')
        from('src/org/apache/xerces/jaxp/datatype/javax.xml.datatype.DatatypeFactory')
        from('src/org/apache/xerces/jaxp/validation/javax.xml.validation.SchemaFactory')
        from('src/org/apache/xerces/stax/javax.xml.stream.XMLEventFactory')
    }
}

jar {
    archiveBaseName.set('xercesImpl')
    manifest {
        attributes(
            'Implementation-Title': 'org.apache.xerces.impl',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Apache Software Foundation',
            'Implementation-URL': 'http://xerces.apache.org/xerces2-j/',
            'Automatic-Module-Name': 'org.apache.xerces'
        )
    }
    from(project.rootDir) {
        include 'LICENSE', 'NOTICE'
        into 'META-INF'
    }
}

task samplesJar(type: Jar) {
    archiveBaseName.set('xercesSamples')
    from sourceSets.samples.output
    from(project.rootDir) {
        include 'LICENSE', 'NOTICE'
        into 'META-INF'
    }
}

test {
    useJUnit()
    workingDir = project.rootDir

    systemProperty 'javax.xml.parsers.DocumentBuilderFactory', 'org.apache.xerces.jaxp.DocumentBuilderFactoryImpl'
    systemProperty 'javax.xml.parsers.SAXParserFactory', 'org.apache.xerces.jaxp.SAXParserFactoryImpl'
    systemProperty 'javax.xml.validation.SchemaFactory:http://www.w3.org/2001/XMLSchema', 'org.apache.xerces.jaxp.validation.XMLSchemaFactory'

    include '**/*Test.class'
    include 'dom/dom3/Test.class'
    include 'dom/events/Test.class'
    include 'dom/ids/Test.class'
    include 'dom/mem/Test.class'
    include 'dom/range/Test.class'
    include 'dom/range/TestCompare.class'
    include 'dom/registry/Test.class'
    include 'dom/rename/Test.class'
    include 'dom/serialization/Test.class'
    include 'dom/serialize/Test*.class'
    include 'dom/traversal/*Test.class'
    include 'dom/treewalker/TestFirstChild.class'
    include 'idc/IDConstraintTests.class'
    include 'io/UTF*.class'
    include 'jaxp/*Test*.class'
    include 'jaxp/PropertyTest.class'
    include 'schema/Test.class'
    include 'schema/annotations/*Test.class'
    include 'schema/config/*Test.class'
    include 'thread/Test.class'
    include 'xinclude/Test.class'

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

    }
}

tasks.register('generateChecksums') {
    group = 'distribution'
    description = 'Generates SHA-512 checksums for distribution archives'
    dependsOn 'distSrcZip', 'distSrcTar', 'distBinZip', 'distBinTar'

    doLast {
        def distDir = layout.buildDirectory.dir('distributions').get().asFile
        distDir.listFiles({ File f -> f.isFile() && !f.name.endsWith('.sha512') } as FileFilter)?.each { file ->
            def digest = java.security.MessageDigest.getInstance('SHA-512')
            file.eachByte(4096) { bytes, count ->
                digest.update(bytes, 0, count)
            }
            def sha512 = digest.digest().collect { String.format('%02x', it) }.join('')
            new File(file.parentFile, "${file.name}.sha512").text = "${sha512}  ${file.name}\n"
        }
    }
}

tasks.register('dist') {
    group = 'distribution'
    description = 'Builds all ASF source and binary distributions with SHA-512 checksums'
    dependsOn 'distSrcZip', 'distSrcTar', 'distBinZip', 'distBinTar', 'generateChecksums'
}

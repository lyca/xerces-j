tasks.register('conformanceTest', Test) {
    description = 'Runs the W3C XML Conformance Test Suite'
    group = 'verification'
    dependsOn 'downloadXmlConformanceSuite'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
    workingDir = rootProject.rootDir

    systemProperty 'xmlconf.dir', rootProject.layout.buildDirectory.dir('xmlconf-suite/xmlconf').get().asFile.absolutePath

    include 'conformance/XMLConformanceTest.class'

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}


import java.security.MessageDigest

plugins {
    id 'java-library'
}

description = 'Apache Xerces-J Core Implementation'

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api 'xml-apis:xml-apis:1.4.01'
    implementation 'xml-resolver:xml-resolver:1.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    archiveBaseName.set('xercesImpl')
    manifest {
        attributes(
            'Implementation-Title': 'org.apache.xerces.impl',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Apache Software Foundation',
            'Implementation-URL': 'http://xerces.apache.org/xerces2-j/',
            'Automatic-Module-Name': 'org.apache.xerces'
        )
    }
}

sourcesJar {
    archiveBaseName.set('xercesImpl')
}

javadocJar {
    archiveBaseName.set('xercesImpl')
}

javadoc {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
        windowTitle = 'Xerces2 Implementation'
        docTitle = 'Xerces2 Implementation'
        bottom = 'Copyright &copy; 1999-2026 The Apache Software Foundation. All Rights Reserved.'
        tags = [
            'xerces.internal:a:Internal:',
            'xerces.experimental:a:Experimental:'
        ]
        addStringOption('Xdoclint:none', '-quiet')
    }
}

task dtdJar(type: Jar) {
    archiveBaseName.set('xerces-dtd')
    from(sourceSets.main.output) {
        exclude 'org/apache/xerces/impl/xs/**'
        exclude 'org/apache/xerces/impl/xpath/regex/**'
    }
}

tasks.register('downloadXmlConformanceSuite') {
    description = 'Downloads, verifies (SHA-256) and extracts the W3C XML Conformance Test Suite (xmlts)'
    group = 'verification'

    def archiveUrl = 'https://www.w3.org/XML/Test/xmlts20130923.tar.gz'
    def expectedSha256 = '9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f'
    def suiteDir = rootProject.layout.buildDirectory.dir('xmlconf-suite')
    def archiveFile = rootProject.layout.buildDirectory.file('xmlconf-suite/xmlts20130923.tar.gz')
    def markerFile = rootProject.layout.buildDirectory.file('xmlconf-suite/xmlconf/xmlconf.xml')

    outputs.file(markerFile)

    doLast {
        def targetDir = suiteDir.get().asFile
        if (!targetDir.exists()) {
            targetDir.mkdirs()
        }
        def targetFile = archiveFile.get().asFile
        if (!targetFile.exists()) {
            logger.lifecycle("Downloading XML Conformance Test Suite from ${archiveUrl}...")
            ant.get(src: archiveUrl, dest: targetFile, verbose: false, usetimestamp: true)
        }

        // Verify SHA-256 checksum
        def digest = MessageDigest.getInstance('SHA-256')
        targetFile.eachByte(4096) { bytes, count ->
            digest.update(bytes, 0, count)
        }
        def actualSha256 = digest.digest().collect { String.format('%02x', it) }.join('')
        if (!actualSha256.equalsIgnoreCase(expectedSha256)) {
            targetFile.delete()
            throw new GradleException("SHA-256 checksum mismatch for ${targetFile.name}!\nExpected: ${expectedSha256}\nActual:   ${actualSha256}")
        }

        if (!markerFile.get().asFile.exists()) {
            logger.lifecycle("Extracting XML Conformance Test Suite...")
            ant.untar(src: targetFile, dest: targetDir, compression: 'gzip')
        }
    }
}


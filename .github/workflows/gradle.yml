name: Gradle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  build:
    name: Gradle Build with Java ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8', '11', '17', '21', '25']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Target JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.jdk }}

    - name: Set up Java 21 for Gradle Daemon (when targeting older JDKs)
      if: matrix.jdk == '8' || matrix.jdk == '11'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Gradle Build & Test (Java ${{ matrix.jdk }})
      run: |
        if [ "${{ matrix.jdk }}" = "8" ] || [ "${{ matrix.jdk }}" = "11" ]; then
          ./gradlew build dtdJar sanity -PtestJavaVersion=${{ matrix.jdk }} --info
        else
          ./gradlew build dtdJar sanity --info
        fi

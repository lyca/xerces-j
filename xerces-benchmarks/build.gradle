plugins {
    id 'java-library'
}

description = 'Apache Xerces-J JMH Microbenchmarks'

dependencies {
    implementation project(':xerces-impl')
    implementation 'xml-apis:xml-apis:1.4.01'

    implementation 'org.openjdk.jmh:jmh-core:1.37'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    implementation 'com.fasterxml.woodstox:woodstox-core:7.1.0'
    implementation 'org.codehaus.woodstox:stax2-api:4.2.2'
    implementation 'com.fasterxml:aalto-xml:1.3.3'
}

jar {
    archiveBaseName.set('xercesBenchmarks')
}

tasks.register('jmh', JavaExec) {
    group = 'benchmark'
    description = 'Executes JMH benchmarks'
    dependsOn classes
    mainClass = 'org.openjdk.jmh.Main'
    classpath = sourceSets.main.runtimeClasspath

    if (project.hasProperty('jmhArgs')) {
        args project.property('jmhArgs').toString().split('\\s+')
    }
}

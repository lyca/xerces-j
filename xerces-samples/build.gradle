import javax.inject.Inject

plugins {
    id 'java-library'
}

description = 'Apache Xerces-J Samples'

dependencies {
    api project(':xerces-impl')
}

jar {
    archiveBaseName.set('xercesSamples')
}

abstract class SanityCheckTask extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getClasspath()

    @InputFile
    abstract RegularFileProperty getSampleInputFile()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void run() {
        def cp = getClasspath()
        def samplePath = getSampleInputFile().get().asFile.absolutePath
        ['sax.Counter', 'sax.Writer', 'dom.Counter', 'dom.Writer'].each { className ->
            println "Running sanity check: ${className} ..."
            getExecOperations().javaexec {
                classpath = cp
                mainClass = className
                args = [samplePath]
            }
        }
    }
}

tasks.register('sanity', SanityCheckTask) {
    group = 'verification'
    description = 'Runs sample Counter and Writer programs as a sanity check.'
    dependsOn compileJava
    classpath.from(sourceSets.main.runtimeClasspath)
    sampleInputFile.set(layout.projectDirectory.file('src/main/resources/data/personal.xml'))
}
